<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP Final - Docker Compose</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f4f8;
        font-family: system-ui, -apple-system, sans-serif;
        color: #1f2937;
      }
      main {
        background: #fff;
        padding: 2rem 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        max-width: 560px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        color: #2563eb;
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 1.5rem;
      }
      .alunos {
        color: #6b7280;
        font-weight: 500;
      }
      pre {
        background: #1f2937;
        color: #a7f3d0;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TP Final - Docker Compose</h1>
      <p>Site estático em nginx com imagem customizada</p>
      <p class="alunos">Luiz Felipe & Danilo Santos</p>
      <h2>Resposta da API:</h2>
      <pre id="api">carregando...</pre>
    </main>
    <script>
      fetch("http://localhost:8081")
        .then((r) => r.json())
        .then((d) => (api.textContent = JSON.stringify(d, null, 2)))
        .catch(() => (api.textContent = "API offline"));
    </script>
  </body>
</html>
